name: CI/CD Pipeline

on:
  push:
    branches: [ main ] # master/main file
# CI/CD Pipeline will be triggered on push to the main branch is pushed
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Oracle Cloud Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/hadir_visitors_website/visitors_hadir
            git pull origin main
            npm install
            pm2 restart all